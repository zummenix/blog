{% extends "base.html" %}

{% block meta_description %}
<meta name="description" content="{{ page.description }}">
{% endblock %}

{% block navigation %}
{{<blog.navbar />}}
{% endblock %}

{% block content %}
<h1>{{ page.title }}</h1>
<p>
  {{<blog.tags_list tags={page.taxonomies.tags} />}}
  <br>
  {{<blog.show_date date={page.date} />}}
</p>
{{ page.content | safe }}
{% endblock %}
